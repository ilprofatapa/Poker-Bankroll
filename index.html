<head>

<title>PokerRoll</title>
<style>
:root{--bg:#0f1714;--card:#17221d;--card2:#1e2c26;--line:#2a3a33;--tx:#e9f1ec;--mut:#8fa59a;--acc:#2fbf71;--acc2:#1f6b45;--gold:#e8b84a;--red:#ff6b6b;--yel:#f2c94c;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:700}
header h1 span{color:var(--acc)}
#hdr{font-weight:700;font-variant-numeric:tabular-nums}
main{padding:14px 16px calc(150px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0b110e;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button .i{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 10px;font-weight:600}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0}
.row+.row{border-top:1px solid var(--line)}
.mut{color:var(--mut)} .sm{font-size:12.5px}
.pos{color:var(--acc)} .neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card2);border-radius:10px;padding:9px 10px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--mut)}
.btn{background:var(--acc);color:#04130b;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.dan{background:transparent;color:var(--red);border:1px solid #5a2a2a}
.btn.full{width:100%}
.btn.sm{padding:7px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:6px 11px;border-radius:20px;font-size:13px;font-family:inherit}
.chip.on{background:var(--acc2);border-color:var(--acc)}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:2px 4px 0 0;font-weight:500}
.badge.w{color:var(--yel);border-color:#6b5a1c}
.badge.g{color:var(--gold);border-color:#6b5a1c}
.month{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 6px}
.light{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;background:var(--card2);margin-top:10px;font-size:14px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:3px}
.dot.g{background:var(--acc)} .dot.y{background:var(--yel)} .dot.r{background:var(--red)}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.alert.r{background:#3a1a1a;border:1px solid #6b2a2a}
.alert.y{background:#3a3218;border:1px solid #6b5a1c}

table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;border-top:0}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
input[type=date]{min-height:44px}
textarea{min-height:64px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;transform:scale(1.2)}
.chk{display:flex;align-items:center;color:var(--tx);font-size:14px;margin:12px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:2px 12px 12px;margin:14px 0 0}
legend{color:var(--gold);font-size:13px;padding:0 6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px;border-radius:8px;font-weight:600;font-size:14px;font-family:inherit}
.seg button.on{background:var(--acc2);color:var(--tx)}
form[data-kind=cash] .only-mtt,form[data-kind=mtt] .only-cash{display:none}
.preview{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:4px 12px;margin-top:14px;font-size:13.5px}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
svg.chart{width:100%;height:150px;display:block}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#04130b;border:0;font-size:30px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
pre{white-space:pre-wrap;font-size:12.5px;background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--line);font-family:ui-monospace,Menlo,monospace}
.back{margin-bottom:12px}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-size:14.5px;line-height:1.5;word-wrap:break-word}
.msg.user{background:var(--acc2);margin-left:14%}
.msg.model{background:var(--card2);margin-right:4%}
.msg.err{background:#3a1a1a;border:1px solid #6b2a2a}
button[disabled],textarea[disabled]{opacity:.5}
a{color:var(--gold)}
.qh{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--gold);font-weight:700;font-size:13px;line-height:20px;padding:0;margin-left:6px;vertical-align:middle;cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0}
.card h2 .qh,h3 .qh{float:right;margin:-3px 0 0 8px}
#helpm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#helpm.open{display:flex}
.guide{font-size:14.5px;line-height:1.55}
details.card>summary{font-weight:600;cursor:pointer;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'+';float:right;color:var(--mut);font-weight:700}
details.card[open]>summary::after{content:'−'}
</style>

<body>
<header><h1>Poker<span>Roll</span></h1><div id="hdr"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="helpm"><div class="sheet" id="hsheet"></div></div>
<input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="doImport(this)">
<script>
'use strict';
/* =================== Utilità =================== */
const KEY='pokerroll_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function isoLocal(d){d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
const today=()=>isoLocal(new Date());
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return isoLocal(d)}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
function money(v,sign){const f=new Intl.NumberFormat('it-IT',{style:'currency',currency:S.settings.currency||'EUR'}).format(v||0);return sign&&v>0.004?'+'+f:f}
const pc=v=>isFinite(v)?(v*100).toFixed(1).replace('.',',')+'%':'—';
const n1=v=>isFinite(v)?(Math.round(v*10)/10).toString().replace('.',','):'—';
const fdate=d=>d?d.split('-').reverse().join('/'):'';
const cl=v=>v>0.004?'pos':v<-0.004?'neg':'';
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const inp=(n,v,ph='',im='decimal')=>`<input name="${n}" inputmode="${im}" value="${esc(v??'')}" placeholder="${esc(ph)}" autocomplete="off">`;
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`;

/* =================== Costanti =================== */
const FORMATS={cash_live:'Cash live',cash_online:'Cash online',mtt_live:'Tornei live',mtt_online:'Tornei online',sng:'Sit & Go'};
const PRESETS={
 Conservativo:{cash_live:40,cash_online:50,mtt_live:150,mtt_online:200,sng:75,moveDownPct:20},
 Standard:{cash_live:30,cash_online:40,mtt_live:100,mtt_online:150,sng:50,moveDownPct:25},
 Aggressivo:{cash_live:20,cash_online:25,mtt_live:50,mtt_online:80,sng:30,moveDownPct:30}};
const TTYPES=['Freezeout','Re-entry','PKO / Bounty','Turbo / Hyper','Deepstack','Satellite','SNG'];
const GAMES=['NLH','PLO','PLO5','Mixed','Altro'];
const TXT={deposit:'Deposito',withdraw:'Prelievo',transfer:'Trasferimento tra conti',bonus:'Bonus / promo',rakeback:'Rakeback',expense:'Spesa',adjust:'Rettifica'};
const EXPCAT=['Viaggio','Alloggio','Vitto','Mance','Altro'];
const HINT={deposit:'Soldi aggiunti al roll dai tuoi fondi personali. Non contano come vincita.',
 withdraw:'Soldi tolti dal roll per uso personale. Non contano come perdita.',
 transfer:'Spostamento tra conti (es. contanti → sito online). Il roll totale non cambia.',
 bonus:'Bonus, promozioni, ticket convertiti: aumentano il roll ma restano separati dal risultato al tavolo.',
 rakeback:'Rakeback o cashback del sito: aumenta il roll, separato dal risultato al tavolo.',
 expense:'Viaggio, alloggio, vitto, mance… Se non la paghi con i soldi del roll viene contata solo nei costi della trasferta.',
 adjust:'Correzione del saldo (es. differenza di cambio o errore di conteggio).'};

/* =================== Stato =================== */
function defState(){return{v:1,settings:{currency:'EUR',name:'',lastBackup:''},
 accounts:[{id:'acc_live',name:'Contanti (live)',type:'live',archived:false}],
 tx:[],sessions:[],deals:[],trips:[],pools:[],
 risk:[{id:uid(),from:'2000-01-01',name:'Standard',...PRESETS.Standard,stopLoss:0}],live:null}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v){const d=defState();return{...d,...r,settings:{...d.settings,...r.settings}}}}catch(e){}return defState()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Impossibile salvare i dati: '+e.message)}}
const UI={tab:'home',sub:null,sesFilter:'all',stat:{period:'all',env:'all',kind:'mtt'},lastKind:null,lastAcc:null,fromLive:false};
let _R=null;

/* =================== Calcoli sessione =================== */
const acc=id=>S.accounts.find(a=>a.id===id);
const setting=s=>(acc(s.accountId)||{}).type==='online'?'online':'live';
function cost(s){if(s.kind==='cash')return num(s.buyIn);return Math.max(1,num(s.entries)||1)*(num(s.tBuyIn)+num(s.tFee))+num(s.rebuys)*num(s.rebuyCost)+num(s.addons)*num(s.addonCost)}
function ret(s){return s.kind==='cash'?num(s.cashOut):num(s.prize)+num(s.bounty)}
const gross=s=>ret(s)-cost(s);
function fkey(s){if(s.kind==='cash')return'cash_'+setting(s);if(s.ttype==='SNG')return'sng';return'mtt_'+setting(s)}
function unitBuyIn(s){return s.kind==='cash'?100*num(s.bb):num(s.tBuyIn)+num(s.tFee)}
function sessLabel(s){if(s.kind==='cash')return`Cash ${s.game||'NLH'} ${n1(num(s.sb))}/${n1(num(s.bb))}`;return s.name||`Torneo ${money(unitBuyIn(s))}`}
const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0);
const asc=arr=>[...arr].sort(byDate);
const desc=arr=>[...arr].sort((a,b)=>byDate(b,a));
function dealDesc(d){return d.type==='quote'?`Vendita quote: ${n1(num(d.pct))}% predefinita, markup ${String(num(d.markup)||1).replace('.',',')}`
 :`Il backer paga i buy-in, utile diviso ${n1(num(d.playerShare))}% al giocatore${d.makeup?', con makeup':', senza makeup'}`}

function stakeCalc(s,R){
 const c=cost(s),r=ret(s),g=r-c;const st=s.stake;const d=st&&st.dealId&&S.deals.find(x=>x.id===st.dealId);
 if(!d)return{player:g,backer:0,gross:g,staked:false};
 const D=R.deals[d.id];D.n++;D.ret+=r;
 if(d.type==='quote'){
  const p=Math.min(100,Math.max(0,num(st.pct??d.pct)))/100,m=num(d.markup)||1;
  const player=(1-p)*g+p*c*(m-1),backer=p*r-p*c*m;
  D.invested+=p*c*m;D.player+=player;D.backer+=backer;
  return{player,backer,gross:g,staked:true,deal:d,pct:p*100};
 }
 const sh=Math.min(100,Math.max(0,num(d.playerShare)))/100;D.invested+=c;let player;
 if(d.makeup){if(g<0){D.makeup+=-g;player=0}else{const rep=Math.min(D.makeup,g);D.makeup-=rep;player=(g-rep)*sh}}
 else player=g>0?g*sh:0;
 const backer=g-player;D.player+=player;D.backer+=backer;
 return{player,backer,gross:g,staked:true,deal:d,makeupAfter:D.makeup};
}
function profileAt(d){const ps=[...S.risk].sort((a,b)=>a.from.localeCompare(b.from));let p=ps[0];for(const x of ps)if(x.from<=d)p=x;return p}
const curProfile=()=>profileAt(today());
function riskCheck(s,rollBefore,r){
 const p=profileAt(s.date||today());const fk=fkey(s);
 if(r.staked&&r.deal.type==='split')return{na:true,p,fk};
 let unit=unitBuyIn(s);if(r.staked&&r.deal.type==='quote')unit*=1-r.pct/100;
 const req=num(p[fk])*unit;return{ok:rollBefore+1e-9>=req,req,p,fk};
}
function compute(){
 const R={sess:{},deals:{},acc:{},pools:{},roll:0,tl:[],game:0,promo:0,exp:0,dep:0,wd:0,poolAdj:0,cum:0,peak:0,dd:0,ddPct:0,todayNet:0,month:0};
 S.deals.forEach(d=>R.deals[d.id]={makeup:0,invested:0,ret:0,player:0,backer:0,n:0});
 S.accounts.forEach(a=>R.acc[a.id]=0);
 const add=(id,v)=>{R.acc[id]=(R.acc[id]||0)+v};
 const SR={};asc(S.sessions).forEach(s=>SR[s.id]=stakeCalc(s,R));
 (S.pools||[]).forEach(p=>R.pools[p.id]=poolCalc(p,SR));
 const ev=[];
 S.sessions.forEach(s=>ev.push({d:s.date||'',ts:s.ts||0,s}));
 S.tx.forEach(t=>ev.push({d:t.date||'',ts:t.ts||0,t}));
 (S.pools||[]).forEach(p=>ev.push({d:R.pools[p.id].date||'',ts:9e15,p}));
 ev.sort((a,b)=>a.d.localeCompare(b.d)||a.ts-b.ts);
 let roll=0,cum=0,peak=0;const td=today(),mo=td.slice(0,7);
 for(const e of ev){
  if(e.s){const s=e.s,r=SR[s.id];
   R.sess[s.id]={...r,rollBefore:roll,risk:riskCheck(s,roll,r)};
   roll+=r.player;cum+=r.player;R.game+=r.player;add(s.accountId,r.player);
   if(s.date===td)R.todayNet+=r.player;if((s.date||'').slice(0,7)===mo)R.month+=r.player;
  }else if(e.p){const a=R.pools[e.p.id].myAdj;
   roll+=a;cum+=a;R.game+=a;R.poolAdj+=a;add(e.p.accountId,a);
   if(e.d===td)R.todayNet+=a;if(e.d.slice(0,7)===mo)R.month+=a;
  }else{const t=e.t,a=num(t.amount);
   switch(t.type){
    case'deposit':roll+=a;R.dep+=a;add(t.accountId,a);break;
    case'withdraw':roll-=a;R.wd+=a;add(t.accountId,-a);break;
    case'transfer':add(t.accountId,-a);add(t.toId,a);break;
    case'bonus':case'rakeback':roll+=a;cum+=a;R.promo+=a;add(t.accountId,a);break;
    case'expense':R.exp+=a;if(t.fromRoll!==false){roll-=a;cum-=a;add(t.accountId,-a)}break;
    case'adjust':roll+=a;add(t.accountId,a);break;}
  }
  if(cum>peak)peak=cum;
  R.tl.push({d:e.d,roll,cum});
 }
 R.roll=roll;R.cum=cum;R.peak=peak;R.dd=peak-cum;R.ddPct=R.dd>0&&roll+R.dd>0?R.dd/(roll+R.dd):0;
 return R;
}

/* =================== Statistiche =================== */
function cashStats(L){
 let H=0,G=0,BB=0,Hbb=0,wins=0;
 L.forEach(s=>{const h=num(s.hours),g=gross(s);H+=h;G+=g;if(num(s.bb)>0&&h>0){BB+=g/num(s.bb);Hbb+=h}if(g>0)wins++});
 const w=H>0?G/H:0;let ss=0,k=0;
 L.forEach(s=>{const h=num(s.hours);if(h>0){ss+=Math.pow(gross(s)-w*h,2)/h;k++}});
 const sd=k>1?Math.sqrt(ss/(k-1)):0,se=H>0?sd/Math.sqrt(H):0;
 return{n:L.length,H,G,w,bbh:Hbb>0?BB/Hbb:NaN,winPct:L.length?wins/L.length:0,sd,lo:w-1.96*se,hi:w+1.96*se,k};
}
function mttStats(L){
 let C=0,Rt=0,itm=0,entries=0,bounty=0;const rois=[];
 L.forEach(s=>{const c=cost(s),r=ret(s);C+=c;Rt+=r;if(num(s.prize)>0)itm++;entries+=Math.max(1,num(s.entries)||1);bounty+=num(s.bounty);if(c>0)rois.push((r-c)/c)});
 const n=L.length,roi=C>0?(Rt-C)/C:0;
 const m=rois.reduce((a,b)=>a+b,0)/(rois.length||1);
 const sd=rois.length>1?Math.sqrt(rois.reduce((a,b)=>a+(b-m)**2,0)/(rois.length-1)):0,se=rois.length?sd/Math.sqrt(rois.length):0;
 return{n,C,R:Rt,P:Rt-C,roi,itm:n?itm/n:0,abi:n?C/n:0,reN:n?(entries-n)/n:0,bounty,sd,lo:roi-1.96*se,hi:roi+1.96*se};
}
function bucket(v){const c=money(0).replace(/[\d\s,.]/g,'');if(v<=0)return'Freeroll';if(v<=20)return`fino a 20${c}`;if(v<=50)return`21–50${c}`;if(v<=110)return`51–110${c}`;if(v<=300)return`111–300${c}`;if(v<=600)return`301–600${c}`;return`oltre 600${c}`}

/* =================== Render =================== */
function render(){
 _R=compute();const R=_R;
 $('#hdr').innerHTML=`<span class="${R.roll<0?'neg':''}">${money(R.roll)}</span>`;
 $('#nav').innerHTML=[['home','◆','Home'],['sess','♠','Sessioni'],['stats','▲','Statistiche'],['roll','€','Roll'],['more','☰','Altro']]

function checkPlay(){
 const R=_R,p=curProfile(),fk=$('#chkF').value,v=num($('#chkV').value);
 if(!(v>0))return $('#chkRes').innerHTML=`<div class="light"><span class="dot y"></span><div>Inserisci il buy-in (per il cash: la big blind).</div></div>`;
 const unit=fk.startsWith('cash')?100*v:v,req=num(p[fk])*unit,ratio=req>0?R.roll/req:1;
 const sl=num(p.stopLoss)>0&&-R.todayNet>=num(p.stopLoss);
 let c,t;
 if(sl){c='r';t=`Stop-loss di oggi già raggiunto: la regola dice di non giocare più oggi.`}
 else if(ratio>=1){c='g';t=`Sì. Servono ${money(req)} di roll, ne hai ${money(R.roll)}.`}
 else if(ratio>=0.75){c='y';t=`Al limite: servono ${money(req)}, hai ${money(R.roll)} (${pc(ratio)}). Solo come "shot" ragionato, con la regola di scendere subito se va male.`}
 else{c='r';t=`No. Servono ${money(req)}, hai ${money(R.roll)} (${pc(ratio)}). Il livello è troppo alto per il tuo roll.`}
 $('#chkRes').innerHTML=`<div class="light"><span class="dot ${c}"></span><div>${t}</div></div>`;
}
function chart(vals){
 const W=600,H=150,P=8;let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<1){mx+=1;mn-=1}
 const sx=i=>P+i*(W-2*P)/Math.max(1,vals.length-1),sy=v=>H-P-(v-mn)*(H-2*P)/((mx-mn)||1);
 const pts=vals.map((v,i)=>sx(i).toFixed(1)+','+sy(v).toFixed(1)).join(' ');
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${mn<0&&mx>0?`<line x1="0" x2="${W}" y1="${sy(0).toFixed(1)}" y2="${sy(0).toFixed(1)}" stroke="#2a3a33" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`:''}<polyline points="${pts}" fill="none" stroke="#2fbf71" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="row sm mut"><span>min ${money(Math.min(...vals))}</span><span>max ${money(Math.max(...vals))}</span></div>`;
}

 let h=`<div class="card"><h2>${qh('glossario')}Riepilogo cash game</h2><div class="grid2">${kpi('Sessioni',c.n)}${kpi('Ore giocate',n1(c.H))}${kpi('Risultato al tavolo',money(c.G,1),cl(c.G))}${kpi('Tua quota',money(personal,1),cl(personal))}${kpi('Guadagno orario',money(c.w,1)+'/h',cl(c.w))}${kpi('Big blind all\'ora',isFinite(c.bbh)?n1(c.bbh)+' bb/h':'—',cl(c.bbh))}${kpi('Sessioni vinte',pc(c.winPct))}${kpi('Deviazione std oraria',c.k>1?money(c.sd)+'/h':'—')}</div></div>`;
 h+=c.H>0?verdictCard('cash',Math.round(c.H),c.lo,c.hi,money(c.lo)+'/h',money(c.hi)+'/h','Guadagno orario'):'<div class="alert y">Inserisci le ore giocate per calcolare guadagno orario e affidabilità.</div>';
 h+=breakdown(L,'cash',s=>s.venue||'—','Per luogo / sito');
 h+=breakdown(L,'cash',s=>`${s.game||'NLH'} ${n1(num(s.sb))}/${n1(num(s.bb))}`,'Per livello');
 h+=breakdown(L,'cash',s=>num(s.hours)>=6?'Oltre 6 ore':num(s.hours)>=3?'Da 3 a 6 ore':'Meno di 3 ore','Per durata della sessione');
 return h;
}
function verdictCard(kind,size,lo,hi,loT,hiT,metric){
 const th=kind==='mtt'?[100,500]:[200,1000],unit=kind==='mtt'?'tornei':'ore';
 const sample=size<th[0]?['r',`Campione molto piccolo (${size} ${unit}): i numeri sono dominati dalla fortuna. Non trarre conclusioni.`]
  :size<th[1]?['y',`Campione limitato (${size} ${unit}): indica solo una tendenza.`]:['g',`Campione discreto (${size} ${unit}).`];
 const v=size<3?"Servono più dati per stimare l'intervallo.":lo>0?'Con buona probabilità sei vincente in questo formato.':hi<0?'Con buona probabilità stai perdendo in questo formato: rivedi la selezione dei giochi e i livelli.':"Non si può ancora dire se sei vincente o perdente: il tuo risultato reale potrebbe stare in qualunque punto dell'intervallo.";
 return`<div class="card"><h2>${qh('statistiche')}Quanto sono affidabili questi numeri?</h2><div class="alert ${sample[0]}" style="margin-bottom:8px">${sample[1]}</div>${size>=3?`<div class="row"><span>${metric} reale (intervallo 95%)</span><b>${loT} → ${hiT}</b></div>`:''}<div class="hint">${v}</div></div>`;
}
function breakdown(L,kind,keyFn,title){
 const g={};L.forEach(s=>{const k=keyFn(s);(g[k]=g[k]||[]).push(s)});const keys=Object.keys(g);if(keys.length<2)return'';
 const rows=keys.map(k=>{const a=g[k];if(kind==='mtt'){const m=mttStats(a);return{k,n:m.n,v1:money(m.P,1),c:m.P,v2:pc(m.roi)}}const c=cashStats(a);return{k,n:c.n,v1:money(c.G,1),c:c.G,v2:c.H>0?money(c.w):'—'}}).sort((a,b)=>b.c-a.c);
 return`<div class="card"><h2>${title}</h2><table><tr><th></th><th>N.</th><th>Risultato</th><th>${kind==='mtt'?'ROI':'all\'ora'}</th></tr>${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.n}</td><td class="${cl(r.c)}">${r.v1}</td><td>${r.v2}</td></tr>`).join('')}</table>${rows.some(r=>r.n<20)?'<div class="hint">Le righe con pochi eventi non sono significative.</div>':''}</div>`;
}

 h+=`<div class="card"><h2>Rispetto delle regole</h2>${bad.length?`<div style="margin-bottom:6px">${bad.length} ${bad.length===1?'sessione giocata':'sessioni giocate'} sopra il limite del profilo in vigore in quel momento.</div>`+bad.slice(-5).reverse().map(s=>`<div class="item" data-act="editSess" data-id="${s.id}"><div>${fdate(s.date)} · ${esc(sessLabel(s))}<div class="sm mut">roll richiesto ${money(R.sess[s.id].risk.req)}, disponibile ${money(R.sess[s.id].rollBefore)}</div></div></div>`).join(''):'<div class="pos">Tutte le sessioni rispettano il profilo in vigore al momento in cui sono state giocate.</div>'}<div class="hint">Le sessioni in backing (il backer paga i buy-in) non pesano sul tuo roll e non vengono controllate.</div></div>`;
 h+=`<div class="card"><h2>${qh('rischio')}Nuova versione del profilo</h2><div class="chips">${Object.keys(PRESETS).map(k=>`<button class="chip" data-act="preset" data-k="${k}">${k}</button>`).join('')}</div>
 <form id="rform" onsubmit="return false"><div class="f2"><div><label>Nome</label>${inp('name',p.name,'','text')}</div><div><label>Valido dal</label><input type="date" name="from" value="${today()}"></div></div>
 <div class="f2">${Object.entries(FORMATS).map(([k,l])=>`<div><label>${l} (buy-in)</label>${inp(k,p[k],'','numeric')}</div>`).join('')}<div><label>Calo per scendere (%)</label>${inp('moveDownPct',p.moveDownPct,'25')}</div></div>
 <label>Stop-loss giornaliero (0 = disattivato)</label>${inp('stopLoss',p.stopLoss,'0')}
 <div class="hint">I numeri predefiniti sono indicativi: le guide non concordano (per il cash live si va da 20 a 50 buy-in, per i tornei da 50 a 200). Più il tuo vantaggio è piccolo o incerto, più buy-in servono. Ogni modifica crea una nuova versione: le sessioni passate restano giudicate con le regole di allora.</div>
 <button class="btn full" style="margin-top:12px" data-act="saveRisk">Salva profilo</button></form></div>`;
 h+=`<div class="card"><h2>Storico profili</h2>${hist.map(x=>`<div class="row"><div>${x.from<='2000-01-01'?'Iniziale':'Dal '+fdate(x.from)} · <b>${esc(x.name)}</b><div class="sm mut">Cash live ${num(x.cash_live)} · Tornei live ${num(x.mtt_live)} · Tornei online ${num(x.mtt_online)} · Stop-loss ${num(x.stopLoss)>0?money(num(x.stopLoss)):'no'}</div></div>${hist.length>1?`<button class="btn dan sm" data-act="delRisk" data-id="${x.id}">✕</button>`:''}</div>`).join('')}</div>`;
 return h;

function saveRisk(){

 if(!o.from)return alert('Indica da quando vale il profilo.');
 const p={id:uid(),from:o.from,name:(o.name||'').trim()||'Personalizzato',moveDownPct:num(o.moveDownPct),stopLoss:Math.max(0,num(o.stopLoss))};

 <div class="card"><h2>Dati presenti</h2><div class="row"><span>Sessioni</span><b>${S.sessions.length}</b></div><div class="row"><span>Movimenti</span><b>${S.tx.length}</b></div><div class="row"><span>Accordi di staking</span><b>${S.deals.length}</b></div><div class="row"><span>Trasferte</span><b>${S.trips.length}</b></div><div class="row"><span>Casse comuni</span><b>${(S.pools||[]).length}</b></div></div>

function exportData(){
 const name=`pokerroll-backup-${today()}.json`,data=JSON.stringify(S,null,1),blob=new Blob([data],{type:'application/json'});
 const done=()=>{S.settings.lastBackup=today();save();render()};
 try{const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Backup PokerRoll'}).then(done).catch(()=>{});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);done();
}
function doImport(el){
 const file=el.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.sessions)||!Array.isArray(d.accounts))throw new Error('formato non valido');
  if(!confirm(`Il backup contiene ${d.sessions.length} sessioni e ${(d.tx||[]).length} movimenti. Sostituire i dati attuali?`))return;
  const def=defState();S={...def,...d,settings:{...def.settings,...d.settings}};save();UI.sub=null;UI.tab='home';render();alert('Backup ripristinato.')}
  catch(e){alert('File non valido: '+e.message)}finally{el.value=''}};
 rd.readAsText(file);
}
function wipe(){if(!confirm('Cancellare TUTTI i dati? Operazione irreversibile.'))return;if(!confirm('Sei sicuro? Ti consiglio di esportare prima un backup.'))return;S=defState();save();UI.sub=null;UI.tab='home';render()}

const GUIDE=[
{id:'inizio',t:'Primi passi',b:`<b>1.</b> In <b>Altro → Impostazioni</b> scrivi il tuo nome (compare negli estratti conto e nelle casse comuni).<br><b>2.</b> In <b>Roll → Gestisci conti</b> crea un conto per ogni sito online su cui giochi. Il conto "Contanti (live)" c'è già.<br><b>3.</b> In <b>Roll → + Movimento</b> registra un <b>Deposito</b> con il roll di partenza di ogni conto.<br><b>4.</b> In <b>Altro → Profilo di rischio</b> scegli quanto rischiare.<br><b>5.</b> Da quel momento registra ogni sessione con il tasto verde <b>+</b> in <b>Sessioni</b>.<br><b>Installazione:</b> Android → menu ⋮ → "Installa app"; iPhone → Condividi → "Aggiungi alla schermata Home". Su iPhone usa sempre l'icona e non Safari: i dati sono separati.`},
{id:'conti',t:'Roll, conti e movimenti',b:`Il <b>roll</b> è il totale dei soldi dedicati al poker, cioè la somma di tutti i conti. Lo vedi sempre in alto a destra.<br>In <b>Roll → + Movimento</b> scegli il tipo:<br>• <b>Deposito</b>: soldi che aggiungi dai tuoi fondi personali. Non è una vincita.<br>• <b>Prelievo</b>: soldi che togli per uso personale. Non è una perdita.<br>• <b>Trasferimento tra conti</b>: per esempio dai contanti a un sito online. Il totale non cambia.<br>• <b>Bonus / promo</b> e <b>Rakeback</b>: aumentano il roll ma restano separati dal risultato al tavolo.<br>• <b>Spesa</b>: viaggio, alloggio, vitto, mance. Si può collegare a una trasferta o a una cassa comune. Togli la spunta "Pagata con i soldi del roll" se la paghi con soldi personali.<br>• <b>Rettifica</b>: correzione del saldo (con il meno per togliere).<br>Tocca un movimento per modificarlo o eliminarlo. Un conto che ha movimenti non si elimina: si archivia.`},
{id:'torneo',t:'Registrare un torneo',b:`<b>Sessioni → +</b> → scegli <b>Torneo</b>.<br>• <b>Buy-in</b>: la parte che va nel montepremi (es. 135). <b>Fee / rake</b>: la parte trattenuta dalla sala (es. 15).<br>• <b>Ingressi</b>: 1 se entri una volta, 2 se fai un re-entry, 3 se ne fai due, e così via. Ogni ingresso costa buy-in + fee.<br>• <b>N. rebuy</b> e <b>Costo rebuy</b>, <b>N. add-on</b> e <b>Costo add-on</b>: solo se il torneo li prevede.<br>• <b>Premio</b>: quanto incassi (0 se esci senza premio). <b>Bounty vinte</b>: le taglie incassate nei PKO.<br>• <b>Posizione</b> e <b>Iscritti totali</b>: facoltativi.<br>In fondo al modulo vedi subito costo totale, incasso e risultato. Se il torneo è finanziato da un backer, scegli l'accordo nel riquadro <b>Staking, trasferta, cassa comune</b>.<br><b>Esempio:</b> buy-in 135 + fee 15, 2 ingressi, premio 1.000 → costo 300, risultato +700.`},
{id:'cash',t:'Registrare un cash game',b:`<b>Sessioni → +</b> → scegli <b>Cash game</b>.<br>• <b>Small blind / Big blind</b>: i bui del tavolo (es. 1 e 2).<br>• <b>Totale investito</b>: buy-in iniziale più tutte le ricariche.<br>• <b>Cash-out</b>: quanto hai quando ti alzi dal tavolo.<br>• <b>Ore giocate</b>: indispensabili per il guadagno orario e per capire se le statistiche sono affidabili.<br>Con il cronometro in Home le ore si compilano da sole.`},
{id:'live',t:'Cronometro della sessione',b:`In <b>Home</b> premi <b>▶ Avvia cronometro sessione</b> quando ti siedi. Il tempo continua anche se chiudi l'app. A fine sessione premi <b>Termina e registra</b>: si apre il modulo con data e ore già compilate. <b>Annulla</b> ferma il cronometro senza registrare nulla.`},
{id:'staking',t:'Staking (backer)',b:`In <b>Altro → Staking → + Nuovo accordo</b> crei l'accordo con un backer, poi lo scegli nel modulo della sessione.<br>• <b>Backing</b>: il backer paga i buy-in e l'utile si divide secondo la percentuale al giocatore (es. 50%). Queste sessioni non pesano sul tuo roll.<br>• <b>Con makeup</b>: le perdite si accumulano e vanno recuperate prima di dividere nuove vincite. Senza makeup ogni sessione fa storia a sé.<br>• <b>Vendita quote</b>: vendi una % del torneo; paghi tu e il backer ti rimborsa la sua parte. Il <b>markup</b> (es. 1,10) è il sovrapprezzo sulle quote.<br><b>Estratto conto</b> prepara il riepilogo da mandare al backer su WhatsApp.<br><b>Esempio</b> senza makeup al 50%: costo 300, premio 1.000 → +700 al tavolo, 350 a te e 350 al backer.`},
{id:'casse',t:'Casse comuni con amici',b:`Servono per le uscite in cui dividete vincite e perdite. <b>Altro → Casse comuni → + Nuova cassa comune</b>.<br><b>1.</b> Dai un nome e scegli <b>Come si divide</b>: parti uguali; chi vince dà una % della vincita agli altri; oppure il vincitore tiene una % del totale e il resto va agli altri.<br><b>2.</b> Spunta le tue sessioni dell'uscita (oppure, nel modulo della sessione, scegli la cassa comune).<br><b>3.</b> Con <b>+ Aggiungi chi partecipa</b> inserisci ogni amico: nome, se ha vinto o perso e l'importo netto dell'uscita.<br><b>4.</b> Se dividete anche le spese, spunta <b>Dividere anche le spese</b>.<br>L'app mostra chi deve dare quanto a chi. <b>Condividi il conto</b> manda il riepilogo su WhatsApp; <b>Segna come regolata</b> quando avete saldato.<br><b>Esempio:</b> tu +450, Fabrizio −490, parti uguali → totale −40, cioè −20 a testa: tu dai 470 a Fabrizio.<br>Le tue statistiche restano sul tuo risultato reale (+450); nel roll entra anche il conguaglio (−470).`},
{id:'trasferte',t:'Trasferte',b:`<b>Altro → Trasferte → + Nuova trasferta</b>. Poi collega alla trasferta sia le sessioni (campo <b>Trasferta</b> nel modulo della sessione) sia le spese (<b>+ Spesa</b> sulla scheda della trasferta). Il <b>Netto trasferta</b> è la tua quota di gioco meno le spese: ti dice se il viaggio è stato davvero in attivo.`},
{id:'rischio',t:'Profilo di rischio e "Posso giocarlo?"',b:`Il profilo dice quanti <b>buy-in</b> devi avere nel roll per giocare un livello. Esempio: con 100 buy-in richiesti per i tornei live e un roll di 3.000 €, il buy-in massimo è 30 €.<br>• In <b>Altro → Profilo di rischio</b> scegli un modello (Conservativo, Standard, Aggressivo) o personalizzalo. Imposti anche lo <b>stop-loss giornaliero</b> e il <b>calo</b> oltre il quale valutare di scendere di livello. Poi premi <b>Salva profilo</b>.<br>• Ogni modifica crea una nuova versione con la data: le sessioni passate restano giudicate con le regole di allora.<br>• In <b>Home → Cosa puoi giocare</b> vedi il buy-in massimo per ogni formato. Inserisci formato e buy-in (per il cash la big blind) e premi <b>Posso giocarlo?</b>: verde sì, giallo al limite, rosso no.<br>• Le sessioni giocate oltre il limite hanno il badge "sopra il limite".`},
{id:'statistiche',t:'Statistiche e affidabilità',b:`In <b>Statistiche</b> scegli Tornei o Cash game, il periodo e live/online.<br>• Le statistiche usano il risultato <b>al tavolo</b> (come giochi), non la quota che ti resta dopo staking e casse comuni.<br>• <b>Quanto sono affidabili questi numeri?</b> ti dice se il campione basta e mostra l'<b>intervallo al 95%</b>: il tuo risultato "vero" sta probabilmente lì dentro. Se l'intervallo comprende valori sia positivi sia negativi, non si può ancora dire se sei vincente.<br>• Per una tendenza servono indicativamente almeno 100 tornei o 200 ore di cash; per una certezza molti di più.<br>• Le tabelle per luogo, fascia di buy-in, tipo di torneo e durata aiutano a scegliere dove e cosa giocare.<br>• Il tasto <b>Chiedi all'assistente</b> manda queste statistiche all'AI per un'analisi.`},
{id:'glossario',t:'Glossario',b:`• <b>ROI</b>: profitto diviso per quanto hai speso nei tornei. +20% = ogni 100 € spesi ne guadagni 20.<br>• <b>ITM</b>: percentuale di tornei chiusi a premio.<br>• <b>Costo medio per torneo</b>: spesa media per torneo, re-entry compresi.<br>• <b>Guadagno orario</b>: risultato del cash diviso per le ore.<br>• <b>bb/h</b>: big blind vinte all'ora, utile per confrontare livelli diversi.<br>• <b>Deviazione standard</b>: quanto oscillano i risultati; più è alta, più varianza.<br>• <b>Downswing</b>: calo dal punto più alto raggiunto.<br>• <b>Makeup</b>: perdite verso il backer da recuperare prima di dividere.<br>• <b>Markup</b>: sovrapprezzo sulle quote vendute.<br>• <b>Stop-loss</b>: perdita massima giornaliera oltre la quale ci si ferma.`},
{id:'ai',t:'Assistente AI',b:`<b>Altro → Assistente AI</b>. Funziona con una chiave Gemini gratuita e personale:<br><b>1.</b> Apri aistudio.google.com/apikey con il tuo account Google.<br><b>2.</b> Premi <b>Create API key</b> e copia la chiave.<br><b>3.</b> Incollala nell'app e premi <b>Salva e verifica</b>.<br>Non serve attivare la fatturazione. A ogni domanda l'assistente legge i tuoi dati aggiornati: puoi chiedergli analisi ("dove sto perdendo soldi?") o come si fa qualcosa nell'app. Se compare "limite raggiunto", scegli un modello <b>Flash-Lite</b> nelle impostazioni dell'assistente. I nomi dei backer non vengono mai inviati; le note delle sessioni solo se lo attivi.`},
{id:'backup',t:'Backup e cambio telefono',b:`I dati sono <b>solo sul tuo telefono</b>: se lo perdi o lo cambi, li recuperi solo con un backup.<br>• <b>Altro → Backup e dati → Esporta backup</b>: salva il file su Google Drive o mandalo a te stesso via email. Fallo almeno ogni due settimane (la Home te lo ricorda).<br>• Sul nuovo telefono installa l'app, poi <b>Importa backup</b> e scegli il file. Sostituisce tutti i dati presenti.<br>• La chiave dell'assistente AI non è nel backup: va reinserita.<br>• Gli aggiornamenti dell'app non cancellano i dati.`},
];

/* =================== Casse comuni =================== */
const meName=()=>S.settings.name||'Io';
const poolsDesc=()=>[...(S.pools||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function poolModeDesc(p){const e=p.includeExp?' · spese condivise':' · spese escluse';
 if(p.mode==='pct')return`Chi vince dà il ${n1(num(p.pct))}% della vincita agli altri`+e;
 if(p.mode==='winner')return`Il vincitore tiene il ${n1(num(p.winPct))}% del totale, il resto diviso tra gli altri`+e;
 return'Parti uguali'+e}
function poolLinks(p){return{ses:S.sessions.filter(s=>s.poolId===p.id).map(s=>s.id),tx:S.tx.filter(t=>t.type==='expense'&&t.poolId===p.id).map(t=>t.id)}}
function poolCalc(p,SR,links){
 links=links||poolLinks(p);
 const ses=links.ses.map(id=>S.sessions.find(s=>s.id===id)).filter(Boolean),txs=links.tx.map(id=>S.tx.find(t=>t.id===id)).filter(Boolean);
 const inc=!!p.includeExp;
 const parts=[{me:true,name:meName(),res:ses.reduce((a,s)=>a+((SR[s.id]||{}).player||0),0),exp:txs.reduce((a,t)=>a+num(t.amount),0)},
  ...(p.people||[]).map(x=>({name:x.name,res:num(x.res),exp:num(x.exp)}))];
 const n=parts.length,tot=parts.reduce((a,x)=>a+x.res,0),totExp=inc?parts.reduce((a,x)=>a+x.exp,0):0;
 let fallback=false,wi=-1;parts.forEach(x=>x.g=x.res);
 if(n>1){
  if(p.mode==='pct'){const k=Math.min(100,Math.max(0,num(p.pct)))/100;
   parts.forEach((x,i)=>{if(x.res>0){const give=x.res*k;x.g-=give;parts.forEach((y,j)=>{if(j!==i)y.g+=give/(n-1)})}})}
  else if(p.mode==='winner'){wi=parts.reduce((b,x,i)=>x.res>parts[b].res?i:b,0);
   if(tot>0){const k=Math.min(100,Math.max(0,num(p.winPct)))/100;parts.forEach((x,i)=>x.g=i===wi?tot*k:tot*(1-k)/(n-1))}
   else{fallback=true;parts.forEach(x=>x.g=tot/n)}}
  else parts.forEach(x=>x.g=tot/n);
 }
 parts.forEach(x=>{x.share=x.g-(inc?totExp/n:0);x.actual=x.res-(inc?x.exp:0);x.bal=x.share-x.actual});
 const cr=parts.map((x,i)=>({i,v:Math.round(x.bal*100)/100})).filter(x=>x.v>0.004).sort((a,b)=>b.v-a.v);
 const db=parts.map((x,i)=>({i,v:Math.round(-x.bal*100)/100})).filter(x=>x.v>0.004).sort((a,b)=>b.v-a.v);
 const tr=[];let a=0,b=0;
 while(a<db.length&&b<cr.length){const v=Math.round(Math.min(db[a].v,cr[b].v)*100)/100;if(v>0.004)tr.push({from:parts[db[a].i].name,to:parts[cr[b].i].name,v});db[a].v-=v;cr[b].v-=v;if(db[a].v<=0.004)a++;if(cr[b].v<=0.004)b++}
 const dates=[p.date,...ses.map(s=>s.date),...txs.map(t=>t.date)].filter(Boolean).sort();
 return{parts,n,tot,totExp,inc,tr,myAdj:parts[0].bal,fallback,wi,date:dates[dates.length-1]||p.date||today(),nSes:ses.length,nTx:txs.length};
}

 S.deals.forEach(d=>{const D=R.deals[d.id];L.push(`STAKING con ${bname(d)}: ${dealDesc(d)}; ${D.n} sessioni; investito dal backer ${money(D.invested)}; risultato backer ${money(D.backer)}; quota giocatore ${money(D.player)}${d.type==='split'&&d.makeup?'; makeup attuale '+money(D.makeup):''}.`)});
 S.trips.forEach(t=>{const x=tripStats(t.id,R);L.push(`TRASFERTA "${t.name}" (${t.from}): ${x.n} sessioni, quota di gioco ${money(x.player)}, spese ${money(x.exp)}, netto ${money(x.net)}.`)});
 poolsDesc().slice(0,10).forEach((q,i)=>{const c=R.pools[q.id];L.push(`CASSA COMUNE ${i+1} (${c.date}): ${c.n} partecipanti; divisione: ${poolModeDesc(q)}; totale del gruppo ${money(c.tot)}; mio risultato ${money(c.parts[0].res)}; mia quota ${money(c.parts[0].share)}; conguaglio sul mio roll ${money(c.myAdj)}.`)});
 const last=desc(S.sessions).slice(0,40).reverse();
 if(last.length){L.push(`ULTIME ${last.length} SESSIONI (data | formato | ambiente | luogo | dettagli | costo | incasso | risultato al tavolo | quota personale | ore${AI.notes?' | note':''}):`);
  last.forEach(s=>{const x=R.sess[s.id]||{};L.push([s.date,s.kind==='mtt'?'torneo '+(s.ttype||''):'cash '+(s.game||''),setting(s),s.venue||'-',
   s.kind==='mtt'?`buy-in ${money(unitBuyIn(s))}, ${Math.max(1,num(s.entries))} ingressi${num(s.rebuys)?', '+num(s.rebuys)+' rebuy':''}${num(s.addons)?', '+num(s.addons)+' add-on':''}${num(s.position)?', posizione '+num(s.position)+(num(s.field)?' su '+num(s.field):''):''}${x.staked?', in staking':''}${x.risk&&x.risk.ok===false?', SOPRA IL LIMITE':''}`:`bui ${n1(num(s.sb))}/${n1(num(s.bb))}${x.risk&&x.risk.ok===false?', SOPRA IL LIMITE':''}`,
   money(cost(s)),money(ret(s)),money(gross(s)),money(x.player||0),n1(num(s.hours))+' h',AI.notes&&s.notes?String(s.notes).replace(/\s+/g,' ').slice(0,200):''].filter((v,i)=>i<10||AI.notes).join(' | '))});}
 return L.join('\n');
}
function md(t){return esc(t).split('\n').map(l=>{l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(/^#{1,4}\s/.test(l))return'<b>'+l.replace(/^#{1,4}\s/,'')+'</b>';if(/^\s*[-*•]\s+/.test(l))return'• '+l.replace(/^\s*[-*•]\s+/,'');return l}).join('<br>')}
function aiScroll(){requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}
async function aiSend(text){
 text=String(text??(($('#aiIn')||{}).value||'')).trim();if(!text||UI.aiBusy||!AI.key)return;
 AI.hist.push({r:'user',t:text});UI.aiBusy=true;saveAI();render();aiScroll();
 try{
  const msgs=[];AI.hist.filter(m=>m.r!=='err').slice(-14).forEach(m=>{const role=m.r==='user'?'user':'model';const last=msgs[msgs.length-1];if(last&&last.role===role)last.parts[0].text+='\n\n'+m.t;else msgs.push({role,parts:[{text:m.t}]})});
  while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  const j=await gfetch(`models/${AI.model}:generateContent`,{systemInstruction:{parts:[{text:AI_SYS+"\n\nMANUALE DELL'APP:\n"+guideText()+"\n\nDATI DELL'UTENTE (aggiornati ad ora):\n"+aiContext()}]},contents:msgs,generationConfig:{temperature:0.4}});
  const c=j.candidates&&j.candidates[0];
  const out=((c&&c.content&&c.content.parts)||[]).filter(x=>!x.thought&&x.text).map(x=>x.text).join('').trim();
  AI.hist.push(out?{r:'model',t:out}:{r:'err',t:'Il modello non ha risposto (risposta bloccata o vuota). Prova a riformulare la domanda.'});
 }catch(e){AI.hist.push({r:'err',t:aiErr(e)})}
 UI.aiBusy=false;if(AI.hist.length>60)AI.hist=AI.hist.slice(-60);saveAI();
 if(UI.tab==='more'&&UI.sub==='ai'){render();aiScroll()}
}
function vAI(){
 if(!AI.key)return`<div class="card"><h2>${qh('ai')}Attiva l'assistente</h2><div class="sm">L'assistente usa Gemini di Google con <b>la tua chiave personale gratuita</b>: non paghi nulla e i limiti di utilizzo valgono solo per te.</div>
 <ol class="sm" style="padding-left:18px;margin:10px 0">
 <li>Apri <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> e accedi con il tuo account Google.</li>
 <li>Premi <b>Create API key</b> (se chiede un progetto, accetta quello proposto).</li>
 <li>Copia la chiave e incollala qui sotto.</li></ol>
 <label>Chiave API Gemini</label><input id="aiKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">
 <button class="btn full" id="aiVerifyBtn" style="margin-top:10px" data-act="aiVerify">Salva e verifica</button>
 <div class="hint">Non attivare la fatturazione su Google: il piano gratuito basta. La chiave resta solo su questo telefono e non finisce nei backup.</div></div>
 <div class="card"><h2>Privacy</h2><div class="sm">A ogni domanda l'app invia a Google un riepilogo dei tuoi numeri (risultati, buy-in, luoghi). I nomi dei backer non vengono mai inviati. Con il piano gratuito, Google può usare i contenuti ricevuti per migliorare i suoi prodotti.</div></div>`;
 const quick=["Spiegami come si usa l'app",'Come registro un torneo con re-entry?','Analizza il mio andamento generale','Sto rispettando il bankroll management?','Dove sto perdendo soldi?','A che livello dovrei giocare adesso?','I miei risultati sono fortuna o bravura?'];
 const log=AI.hist.map(m=>`<div class="msg ${m.r}">${m.r==='user'?esc(m.t).replace(/\n/g,'<br>'):md(m.t)}</div>`).join('');
 return`<div class="card"><h2>${qh('ai')}Assistente AI</h2>${AI.hist.length?'':`<div class="sm mut">Chiedimi un'analisi dei tuoi dati o confrontati con me su bankroll, livelli, staking e varianza. A ogni domanda leggo i dati aggiornati dell'app.</div>`}
 <div id="aiLog">${log}${UI.aiBusy?'<div class="msg model mut">Sto analizzando i tuoi dati…</div>':''}</div>
 <div class="chips" style="margin-top:10px">${quick.map(q=>`<button class="chip" data-act="aiQuick" data-q="${esc(q)}" ${UI.aiBusy?'disabled':''}>${esc(q)}</button>`).join('')}</div>
 <textarea id="aiIn" placeholder="Scrivi una domanda…" ${UI.aiBusy?'disabled':''}></textarea>
 <button class="btn full" style="margin-top:8px" data-act="aiSend" ${UI.aiBusy?'disabled':''}>Invia</button></div>
 <div class="card"><h2>Impostazioni assistente</h2>
 <label>Modello</label><select onchange="AI.model=this.value;saveAI()">${AI.models.map(m=>opt(m.id,`${m.label} (${m.id})`,AI.model)).join('')}</select>
 <div class="hint">Se ricevi un errore di limite raggiunto, scegli un modello "Flash-Lite": ha più richieste gratuite al giorno.</div>
 <label class="chk"><input type="checkbox" ${AI.notes?'checked':''} onchange="AI.notes=this.checked;saveAI()">Invia anche le note delle sessioni (più contesto, meno privacy)</label>
 <div class="btns" style="margin-top:10px"><button class="btn sec sm" data-act="aiModels">Aggiorna modelli</button><button class="btn sec sm" data-act="aiClear">Nuova chat</button><button class="btn dan sm" data-act="aiForget">Rimuovi chiave</button></div></div>`;
}

/* =================== Modale e azioni =================== */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('open');$('#sheet').scrollTop=0;const f=$('#mform');if(f&&f.getAttribute('oninput'))f.dispatchEvent(new Event('input'))}
function closeModal(){$('#modal').classList.remove('open');$('#sheet').innerHTML='';UI.fromLive=false}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#helpm').addEventListener('click',e=>{if(e.target.id==='helpm')closeHelp()});
const ACT={
 tab:d=>{UI.tab=d.k;UI.sub=null;render();scrollTo(0,0)},
 sub:d=>{UI.tab='more';UI.sub=d.k;render();scrollTo(0,0)},
 back:()=>{UI.sub=null;render()},
 close:closeModal,
 newSess:()=>openModal(sessForm(null)),
 editSess:d=>openModal(sessForm(S.sessions.find(s=>s.id===d.id))),
 kind:d=>{const f=$('#mform');f.dataset.kind=d.k;f.elements.kind.value=d.k;f.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));sessPreview()},
 saveSess,delSess,
 sf:d=>{UI.sesFilter=d.k;render()},
 startLive:()=>{S.live={start:Date.now()};save();render()},
 endLive:()=>{const h=Math.max(0.25,Math.round((Date.now()-S.live.start)/9e5)/4);openModal(sessForm({date:today(),hours:h}));UI.fromLive=true},
 cancelLive:()=>{if(confirm('Annullare il cronometro?')){S.live=null;save();render()}},
 check:checkPlay,
 newTx:d=>openModal(txForm({type:d.type||'deposit',tripId:d.trip||''})),
 editTx:d=>openModal(txForm(S.tx.find(t=>t.id===d.id))),
 saveTx,delTx,
 accounts:()=>openModal(accList()),
 newAcc:()=>openModal(accForm(null)),
 editAcc:d=>openModal(accForm(S.accounts.find(a=>a.id===d.id))),
 saveAcc,delAcc,
 newDeal:()=>openModal(dealForm(null)),
 editDeal:d=>openModal(dealForm(S.deals.find(x=>x.id===d.id))),
 saveDeal,delDeal,
 stmt:d=>openModal(stmtView(d.id)),
 share:()=>{const t=$('#stmtText').textContent;if(navigator.share)navigator.share({text:t}).catch(()=>{});else ACT.copy()},
 copy:()=>{const t=$('#stmtText').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Copiato.'),()=>alert('Copia non disponibile: seleziona il testo e copialo a mano.'))},
 newTrip:()=>openModal(tripForm(null)),
 editTrip:d=>openModal(tripForm(S.trips.find(t=>t.id===d.id))),
 saveTrip,delTrip,
 preset:d=>{const f=$('#rform'),p=PRESETS[d.k];Object.entries(p).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v});f.elements.name.value=d.k},
 saveRisk,delRisk,
 exportData,importData:()=>$('#impFile').click(),wipe,
 saveSet:()=>{const o=Object.fromEntries(new FormData($('#sform')));S.settings.name=(o.name||'').trim();S.settings.currency=o.currency;save();render();alert('Salvato.')},
 st:d=>{UI.stat[d.g]=d.k;render()},
 help:d=>openHelp(d.k),
 closeHelp,
 allGuide:()=>{closeHelp();closeModal();UI.tab='more';UI.sub='guide';render();scrollTo(0,0)},
 newPool:()=>openModal(poolForm(null)),
 editPool:d=>openModal(poolForm(S.pools.find(x=>x.id===d.id))),
 viewPool:d=>openModal(poolView(d.id)),
 savePool,delPool,
 addP:()=>{$('#prows').insertAdjacentHTML('beforeend',personRow({name:'',res:0,exp:0}));poolPreview();const r=$('#prows').lastElementChild.querySelector('input');r&&r.focus()},
 rmP:(d,el)=>{el.closest('.prow').remove();poolPreview()},
 togglePaid:d=>{const p=S.pools.find(x=>x.id===d.id);p.settled=!p.settled;save();render();openModal(poolView(d.id))},
 aiVerify,
 aiSend:()=>aiSend(),
 aiQuick:d=>aiSend(d.q),
 askAI:()=>{const f=UI.stat;UI.tab='more';UI.sub='ai';render();scrollTo(0,0);if(AI.key)aiSend(`Analizza in modo critico le mie statistiche ${f.kind==='mtt'?'dei tornei':'del cash game'}${f.env!=='all'?' '+f.env:''}: il campione è sufficiente? Cosa funziona, cosa no, e cosa dovrei cambiare nella gestione del bankroll?`)},
 aiModels:async()=>{try{await aiLoadModels();saveAI();render();alert('Elenco modelli aggiornato.')}catch(e){alert(aiErr(e))}},
 aiClear:()=>{if(!confirm('Cancellare la conversazione?'))return;AI.hist=[];saveAI();render()},
 aiForget:()=>{if(!confirm('Rimuovere la chiave Gemini da questo telefono?'))return;AI={key:'',model:'',models:[],notes:false,hist:[]};saveAI();render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;e.preventDefault();fn(el.dataset,el)});
setInterval(()=>{const t=$('#timer');if(t&&S.live)t.textContent=elapsed()},1000);

render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
